name: Collect prices

# GitHub's schedule runs on UTC. Sydney is UTC+11 in daylight saving (Oct–Apr) and UTC+10 otherwise,
# so 20:30 UTC is 7:30am (or 6:30am) the next morning in Sydney.
# Each store is only collected when it's due this cycle (see runner.is_due), so the daily
# catch-up run is harmless: it only does something if GitHub skipped or delayed a scheduled run.
on:
  schedule:
    - cron: "30 20 * * 2"   # Wednesday morning Sydney: Woolworths, Coles, ALDI Special Buys
    - cron: "30 20 * * 3"   # Thursday morning Sydney: Chemist Warehouse
    - cron: "30 20 * * 5"   # Saturday morning Sydney: ALDI Special Buys
    - cron: "30 20 * * 0"   # Monday morning Sydney: Costco
    - cron: "30 2 * * *"    # Daily catch-up, about 1pm Sydney
  workflow_dispatch:
    inputs:
      chains:
        description: "Stores to run, separated by spaces (empty = every store that's due and set to run on GitHub)"
        required: false
        default: ""
      max_pages:
        description: "Test run: at most this many pages per group (empty = full run). Test runs save nothing."
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0

      - name: Install
        run: uv sync --frozen

      - name: Collect
        id: collect
        env:
          CW_ALGOLIA_SEARCH_KEY: ${{ secrets.CW_ALGOLIA_SEARCH_KEY }}
          CHAINS: ${{ inputs.chains }}
          MAX_PAGES: ${{ inputs.max_pages }}
        run: |
          args=(--where github)
          for c in $CHAINS; do args+=(--chain "$c"); done
          if [ -n "$MAX_PAGES" ]; then args+=(--max-pages "$MAX_PAGES" --force --no-publish); fi
          set +e
          uv run specials update "${args[@]}" 2>&1 | tee collect.log
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ -n "$MAX_PAGES" ]; then echo "test=true" >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Save history and page data
        id: save
        if: steps.collect.outputs.test != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history
          if git diff --cached --quiet; then
            echo "No new prices."
          else
            git commit -q -m "Prices: $(date -u +%Y-%m-%d) GitHub run"
          fi
          # Pick up anything pushed from the Mac meanwhile, then rebuild the page data from everything.
          git checkout -- site/data 2>/dev/null || true
          git pull -q --rebase
          uv run specials update --no-collect --no-publish
          git add site/data
          git diff --cached --quiet || git commit -q -m "Page data: $(date -u +%Y-%m-%d)"
          git push -q
          echo "saved=true" >> "$GITHUB_OUTPUT"

      - uses: actions/configure-pages@v6
        if: steps.save.outputs.saved == 'true'

      - name: Give the app its backend settings (from GitHub secrets; never committed)
        if: steps.save.outputs.saved == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            printf '{"supabaseUrl":"%s","supabaseKey":"%s"}\n' "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > site/app-config.json
          fi
      - uses: actions/upload-pages-artifact@v5
        if: steps.save.outputs.saved == 'true'
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v5
        if: steps.save.outputs.saved == 'true'

      - name: Fail if a store was blocked or broke (this sends you an email)
        if: steps.collect.outputs.code != '0'
        run: |
          echo "::error::A store was blocked or failed. See the Collect step log."
          grep -E "PROBLEMS|blocked|error" collect.log || true
          exit 1
