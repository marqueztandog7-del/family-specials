<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Family Specials</title>
  <meta name="description" content="Specials on the things our family buys.">
  <meta name="robots" content="noindex, nofollow">
  <!-- Install to home screen: Android/Chrome uses the manifest; iPhone uses the apple-* tags. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Specials">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header>
    <div class="title"><h1>Family Specials</h1><span id="updated" class="meta"></span></div>
    <form id="search-form" role="search">
      <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off"
             placeholder="Search, e.g. milk, rice, Colgate" aria-label="Search products">
    </form>
    <div id="chains" class="chips" aria-label="Stores"></div>
    <div class="controls">
      <label class="switch"><input id="specials-only" type="checkbox" checked> Specials only</label>
      <label>Sort
        <select id="sort">
          <option value="match">Best match</option>
          <option value="unit">Unit price</option>
          <option value="price">Price</option>
          <option value="saving">Biggest saving</option>
        </select>
      </label>
    </div>
  </header>

  <main>
    <section id="view-search">
      <p id="count" class="meta"></p>
      <div id="results"></div>
      <p class="meta note">Shelf prices and specials only: member prices, delivery and bag fees are left out.
        Unit prices are worked out from the pack size where it can be read reliably.</p>
    </section>
    <section id="view-stores" hidden>
      <h2>Stores</h2>
      <div id="stores"></div>
    </section>
  </main>

  <nav class="tabbar" aria-label="Views">
    <button type="button" data-view="search" aria-current="page">Search</button>
    <button type="button" data-view="stores" aria-current="false">Stores</button>
  </nav>
</body>
</html>
