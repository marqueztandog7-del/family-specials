<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Family Specials</title>
  <meta name="description" content="Specials on the things our family buys.">
  <meta name="robots" content="noindex, nofollow">
  <!-- Install to home screen: Android/Chrome uses the manifest; iPhone uses the apple-* tags. -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#F9F7F4">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Specials">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <!-- Pantry Standard type: Plus Jakarta Sans (text), JetBrains Mono (prices), Material Symbols (icons, only the ones we use).
       Cached by sw.js after the first visit so they work offline. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" crossorigin="anonymous" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=add,add_circle,arrow_back,bar_chart,bookmark,bookmark_add,calendar_today,check,checklist,chevron_right,close,content_copy,delete_sweep,error,expand_more,group,group_add,history,home,info,insights,ios_share,local_fire_department,local_offer,notifications,notifications_active,notifications_off,open_in_new,pause_circle,percent,person_add,receipt,receipt_long,savings,schedule,search,sell,settings,shopping_basket,smartphone,storefront,sync,thumb_up,trending_down,verified,warning,workspace_premium&display=block">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <header class="topbar" id="topbar">
    <div class="topbar-in">
      <div class="brand">
        <button type="button" id="back" class="iconbtn" aria-label="Back" hidden><span class="material-symbols-outlined">arrow_back</span></button>
        <span class="logo" id="logo" aria-hidden="true"><span class="material-symbols-outlined fill">shopping_basket</span></span>
        <h1 id="title">Home</h1>
      </div>
      <div class="top-actions">
        <a id="bell" class="iconbtn" href="#/alerts" aria-label="Alerts" hidden>
          <span class="material-symbols-outlined">notifications</span><b id="alert-count" class="badge" hidden></b></a>
        <a id="gear" class="iconbtn" href="#/settings" aria-label="Settings"><span class="material-symbols-outlined">settings</span></a>
      </div>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <div id="toast" role="status" aria-live="polite"></div>

  <nav class="tabbar" aria-label="Main">
    <div class="tabbar-in">
      <a href="#/this-week" data-tab="this-week"><span class="material-symbols-outlined">calendar_today</span><span>This Week</span></a>
      <a href="#/watchlist" data-tab="watchlist"><span class="material-symbols-outlined">bookmark</span><span>Watchlist</span></a>
      <a href="#/home" data-tab="home" class="home"><span class="home-btn"><span class="material-symbols-outlined">home</span></span><span>Home</span></a>
      <a href="#/list" data-tab="list"><span class="material-symbols-outlined">checklist</span><span>List</span><b id="list-count" class="badge" hidden></b></a>
      <a href="#/savings" data-tab="savings"><span class="material-symbols-outlined">savings</span><span>Savings</span></a>
    </div>
  </nav>
</body>
</html>
