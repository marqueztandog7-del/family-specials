[project]
name = "family-specials"
version = "0.1.0"
description = "Collects supermarket specials for our household and makes them searchable"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pywebpush>=2.5.0",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
]

[project.scripts]
specials = "family_specials:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
