# The family watchlist. Names and rules only: no receipt details, dates or prices paid.
#
# Seeded 16 Oct 2026 from the 36 Core and Regular rows of data/private/family_regular_items.csv,
# at their suggested watch level (keep_on_watchlist and brand_matters weren't filled in yet).
#
# level:
#   exact         one product at one store (anchor.chain + anchor.product_id)
#   same_product  the same product at any store: barcode first, else brand + name + size
#   similar       anything matching the `similar` rule, any store, including store brands
# also_similar: true also watches similar items for a same_product item (the "toggle").
# compare_per:   the unit prices are compared on: kg, L, item, can, bag, sheet, wipe, tea bag
# target:        optional target unit price, e.g. "$12.00/kg"
# categories:    which store categories to read regular prices from for this item
#                (woolworths: category ids, aldi: category keys, coles: browse paths,
#                 costco: search words, chemistwarehouse: category names)
#
# Matching rules (similar):
#   must:     every one of these words must be in the product name
#   any:      at least one of these (variants), if given
#   exclude:  none of these words may appear
#   brands:   "any", or a list of brands
#   size:     allowed pack size (min/max), e.g. {min: 500 g, max: 2 kg}; pack: number of items in the pack
#   fresh:    true = fresh produce only (not canned, frozen or prepared)

household: our-household

