# Which stores we collect from, and how politely. Listed in priority order.
# Edit freely. Store refs come from RECON.md.

household:
  name: Our household
  postcode: "2155"

chains:
  woolworths:
    enabled: true
    run_on: mac   # GitHub test 12 Oct: woolworths.com.au returned 403 to GitHub's servers
    pause_on_block: true   # a refusal pauses Woolworths until you run: specials resume woolworths
    store:
      # Pinning prices to Kellyville North (#1561) needs a login, which we don't do.
      # So prices come from Woolworths' default online store; weekly specials are set state-wide.
      ref: "7008"
      name: Woolworths default online store (#7008)   # Woolworths changes this; #2631 on 12 Oct
      suburb: null
      postcode: null
      price_scope: default_online_store
      notes: "Local store Kellyville North #1561 can't be pinned without logging in."
    politeness: {delay_seconds: [3, 6], max_requests_per_run: 260}
    cycle: {type: weekly, starts: wednesday}
    # The full range, read aisle by aisle (category pages, never search: robots.txt). About 850 requests.
    # Themed collections only repeat products from the real departments, so they're skipped.
    range:
      max_requests: 1100
      skip_departments: [Back to School, Container Bonus Credits, Dinner, Footy Finals, Front of Store, Gift Ideas,
                         Halloween, Lunch Box, Christmas, Easter]
    specials_groups:
      # Woolworths specials group ids (from /apis/ui/PiesCategoriesWithSpecials).
      - {id: specialsgroup.3676, name: Half Price, special_type: half_price, weekly: true}
      - {id: specialsgroup.3694, name: Lower Shelf Price, special_type: lower_shelf_price, weekly: false}
      - {id: specialsgroup.3721, name: Seasonal Price, special_type: seasonal_price, weekly: false}
      - {id: specialsgroup.3668, name: Buy More Save More, special_type: multibuy, weekly: false}
      - {id: specialsgroup.onlineonly, name: Online Only Specials, special_type: online_only, weekly: false}
      # Everyday Low Price (specialsgroup.3673, ~2,900 items) is everyday pricing, not a special.
      # Left out to keep volume down; tracked categories give us regular prices instead.

  coles:
    # PAUSED FOR GOOD (16 Oct 2026): the one slow trial was challenged on half-price page 6 at
    # 9:49am Sydney. Nothing contacts Coles: not the Mac schedule, GitHub, manual commands or category
    # discovery (make_client refuses). No retries and no workarounds, including via a browser.
    # Only you can lift this, by deleting paused_for_good (and setting a new trial_since).
    paused_for_good: "challenged during its trial on 16 Oct 2026"
    enabled: false
    run_on: mac
    pause_for_good_on_block: true
    trial_since: "2026-10-16"
    specials_mode: half_price   # if ever resumed: half-price list + watchlist categories only
    store:
      ref: "0883"
      name: Coles Kellyville
      suburb: Kellyville
      postcode: "2155"
      price_scope: store
      notes: "Click & Collect store, set with the fulfillmentStoreId cookie (no login)."
    politeness: {delay_seconds: [25, 40], max_requests_per_run: 40}
    cycle: {type: weekly, starts: wednesday}

  chemistwarehouse:
    enabled: true
    run_on: mac   # one weekly refresh for every store, on Wednesday morning (19 Oct 2026)
    pause_on_block: true
    store:
      ref: online
      name: Chemist Warehouse online (national)
      suburb: null
      postcode: null
      price_scope: online_national
    politeness: {delay_seconds: [3, 6], max_requests_per_run: 60}
    cycle: {type: weekly, starts: wednesday}
    # Approved 5 Oct 2026 for our categories, and on 19 Oct 2026 for the full range (once a week). Marketplace
    # sellers are left out. Specials from product data = clearance only: the index's in_catalogue flag isn't
    # reliable and "$X Off RRP" is everyday pricing. Catalogue specials come from the catalogue below.
    range: {max_requests: 120, hits_per_page: 1000}
    algolia:
      app_id: 42NP1V2I98
      search_key_env: CW_ALGOLIA_SEARCH_KEY  # set in .env (not committed) or as a GitHub secret
      index: prod_cwr-cw-au_products_en
      hits_per_page: 100
    # The printed catalogue (page images, read with AI; approved 19 Oct 2026). An item counts as a special only
    # when it's cheaper than the price we recorded at Chemist Warehouse before the catalogue started. "Off RRP"
    # savings alone never count. Anything that can't be matched to a product waits for review on the Mac.
    catalogue:
      nexus_client_id: 3476
      max_requests: 60
      model: claude-sonnet-5-5
      api_key_env: ANTHROPIC_API_KEY

  costco:
    enabled: true
    run_on: mac
    pause_on_block: true
    store:
      ref: online
      name: Costco online (national; prices include delivery)
      suburb: null
      postcode: null
      price_scope: online_national
      notes: "Nearest warehouse: Marsden Park (9 km). Warehouse shelf prices are not published online."
    politeness: {delay_seconds: [3, 6], max_requests_per_run: 60}
    cycle: {type: weekly, starts: wednesday}
    specials_categories:
      - {code: hot-buys, name: Hot Buys}
    range: {max_requests: 160}
    # The In-Warehouse Savings booklet (warehouse shelf prices). Its viewer has a text version of every page,
    # so nothing is read from images. Found through costco.com.au/warehouse-savings.
    catalogue:
      max_requests: 60
      warehouse: {ref: warehouse, name: "Costco warehouses (national booklet prices)"}

  aldi:
    enabled: true
    run_on: mac
    pause_on_block: true
    store:
      ref: G449
      name: ALDI North Kellyville
      suburb: North Kellyville
      postcode: "2155"
      price_scope: store
    politeness: {delay_seconds: [3, 6], max_requests_per_run: 60}
    # One refresh a week. Special Buys are published about two weeks ahead, so Wednesday's read already has
    # Saturday's drop.
    cycle: {type: weekly, starts: wednesday}
    special_buys: {days_back: 7, days_ahead: 14}
    range: {max_requests: 90}
